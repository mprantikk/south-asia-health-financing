name: Refresh data

# Pulls the latest World Bank data, runs quality checks, rebuilds the charts,
# REPORT.md and the README key numbers, and commits any change.
on:
  schedule:
    - cron: "17 3 1 * *"      # monthly, 1st of the month
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["hfin/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, check and build report
        run: python -m hfin all
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data docs REPORT.md README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh World Bank data ($(cat data/FETCHED_AT))"
            git push
          fi
